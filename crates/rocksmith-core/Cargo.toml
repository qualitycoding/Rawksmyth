[package]
name = "rocksmith-core"
version = "0.1.0"
edition = "2021"
authors = ["drboots@galactichq.org"]
license = "AGPL-3.0"
description = "High-performance, low-latency audio capture, multi-rate pitch detection, onset tracking, and scoring engine for Rocksmith clone."

[dependencies]
cubeb = { version = "0.13.0", optional = true }
cpal = { version = "0.15.3", optional = true }
rtrb = "0.3.1"
realfft = "3.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = ["mock-backend"]
mock-backend = []
native-cubeb = ["dep:cubeb"]
native-cpal = ["dep:cpal"]
manual-hardware = []
