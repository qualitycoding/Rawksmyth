name: CI (gtcore, CI-tier only)

# Runs only the hardware-independent gtcore crate (T-014 dependency scan
# and the CI-tier unit tests in chart.rs / clock.rs). HW-tier tests
# (T-015, T-016, T-019, T-030) and the Human-tier test (T-022) are not run
# here — see plan/PLAN.md §2B.3 and HANDOFF.md.

on:
  push:
    branches: ["gen-*", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.83.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify freeze manifest
        run: sha256sum -c tests/FROZEN_MANIFEST.sha256
      - name: cargo test (gtcore)
        run: cargo test --workspace
      - name: cargo audit (T-014)
        run: |
          # The project builds on the pinned 1.83.0, but cargo-audit only reads
          # Cargo.lock, so it runs on current stable: cargo-audit < 0.22 cannot
          # parse the CVSS 4.0 scores now in the RustSec advisory database, and
          # 0.22+ needs Rust >= 1.85.
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-audit --locked
          # Print the audit output and also surface it as an annotation, so a
          # failure is diagnosable without downloading the job log.
          if out=$(cargo +stable audit 2>&1); then
            echo "$out"
          else
            echo "$out"
            echo "::error title=cargo audit failed::$(echo "$out" | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
